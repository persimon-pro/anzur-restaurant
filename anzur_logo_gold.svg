<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <defs>
    <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E2BE"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
  </defs>

  <!-- Emblem (compact version for nav) -->
  <g transform="translate(0, 5) scale(0.45)" fill="none" stroke="url(#navGold)">
    <!-- Outer bulb -->
    <path d="M 80 14
             C 80 14, 50 40, 42 68
             C 34 96, 38 122, 56 136
             C 66 142, 80 145, 80 145
             C 80 145, 94 142, 104 136
             C 122 122, 126 96, 118 68
             C 110 40, 80 14, 80 14 Z"
          stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner ring -->
    <ellipse cx="80" cy="93" rx="28" ry="30" stroke-width="7"/>
    <!-- Core drop -->
    <path d="M 80 80 C 80 80, 70 91, 70 98 C 70 104, 74 108, 80 108 C 86 108, 90 104, 90 98 C 90 91, 80 80, 80 80 Z"
          fill="url(#navGold)" stroke="none"/>
  </g>

  <!-- ANZUR text -->
  <text x="80" y="44" font-family="'Josefin Sans', 'Montserrat', sans-serif" font-size="28" font-weight="600" letter-spacing="4" fill="url(#navGold)">ANZUR</text>

  <!-- RESTAURANT subtitle -->
  <text x="80" y="62" font-family="'Montserrat', sans-serif" font-size="8" font-weight="400" letter-spacing="5" fill="url(#navGold)">RESTAURANT</text>
</svg>