<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Вариант 4: Бесшовный Ambient Start и 3D Spotlight — Ресторан «Анзур»</title>
  <link rel="icon" href="/anzur_bulb_pure.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #060504;
      --gold: #D4AF37;
      --gold-light: #FCEFD8;
      --gold-dark: #916D2A;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #f7f4ed;
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hero-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: #060504;
      perspective: 1200px;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      opacity: 0.85;
      transform: scale(1.04);
      transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.8s ease;
    }
    .hero-stage.is-loaded .hero-video {
      transform: scale(1);
      opacity: 0.95;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(6, 5, 4, 0.45) 0%, rgba(6, 5, 4, 0.75) 65%, rgba(6, 5, 4, 0.95) 100%),
        linear-gradient(to bottom, rgba(6, 5, 4, 0.60) 0%, rgba(6, 5, 4, 0.20) 45%, rgba(6, 5, 4, 0.90) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Interactive 3D Ambient Spotlight that follows cursor */
    .ambient-spotlight {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle 450px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(212, 175, 55, 0.16) 0%, rgba(212, 175, 55, 0.04) 50%, transparent 80%);
      mix-blend-mode: screen;
      transition: opacity 0.4s ease;
    }

    /* Cinematic Letterbox Film Bars that glide away on start */
    .letterbox-bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 12vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
      transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1) 0.6s;
    }
    .letterbox-top {
      top: 0;
      transform: translateY(0);
    }
    .letterbox-bottom {
      bottom: 0;
      transform: translateY(0);
    }

    .hero-stage.is-unboxed .letterbox-top {
      transform: translateY(-100%);
    }
    .hero-stage.is-unboxed .letterbox-bottom {
      transform: translateY(100%);
    }

    /* ==========================================================================
       TOP META BAR
       ========================================================================== */
    .hero-top-meta {
      position: relative;
      z-index: 10;
      padding: 2.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(-15px);
      transition: opacity 1s ease 1.1s, transform 1s ease 1.1s;
    }
    .hero-stage.is-unboxed .hero-top-meta {
      opacity: 1;
      transform: translateY(0);
    }
    .meta-coords {
      color: var(--gold);
    }

    /* ==========================================================================
       CENTER 3D TYPOGRAPHY CARD
       ========================================================================== */
    .hero-center {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 1.5rem;
      margin: auto 0;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .hero-emblem-wrap {
      width: 78px;
      height: 78px;
      margin: 0 auto 1.2rem;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.2s ease 0.8s, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
    }
    .hero-stage.is-unboxed .hero-emblem-wrap {
      opacity: 1;
      transform: scale(1);
    }
    .hero-emblem-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .monumental-title {
      font-family: var(--font-serif);
      font-size: clamp(3.2rem, 9vw, 6.5rem);
      font-weight: 300;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.6rem;
      color: #fff;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.9s, transform 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.9s;
    }
    .hero-stage.is-unboxed .monumental-title {
      opacity: 1;
      transform: translateY(0);
    }

    .monumental-sub {
      font-family: var(--font-mono);
      font-size: clamp(0.72rem, 1.4vw, 0.88rem);
      letter-spacing: 0.32em;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      margin-bottom: 2.2rem;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.1s, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.1s;
    }
    .hero-stage.is-unboxed .monumental-sub {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-actions {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.3s, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.3s;
    }
    .hero-stage.is-unboxed .hero-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2.2rem;
      background: linear-gradient(135deg, #E6C875 0%, #C5983A 50%, #966F22 100%);
      color: #120e09;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 0 25px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 35px rgba(212, 175, 55, 0.45);
      filter: brightness(1.1);
    }

    /* ==========================================================================
       BOTTOM BAR
       ========================================================================== */
    .hero-bottom-meta {
      position: relative;
      z-index: 10;
      padding: 2.2rem 3rem 4.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1s ease 1.3s, transform 1s ease 1.3s;
    }
    .hero-stage.is-unboxed .hero-bottom-meta {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       DEMO BAR
       ========================================================================== */
    .demo-bar {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(12, 9, 7, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 0.4rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15);
      max-width: 95vw;
      overflow-x: auto;
    }
    .demo-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      padding: 0 0.6rem 0 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .demo-pill {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      padding: 0.5rem 0.95rem;
      border-radius: 20px;
      background: transparent;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .demo-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .demo-pill.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(145, 109, 42, 0.3));
      border-color: rgba(212, 175, 55, 0.6);
      color: #FCEFD8;
      font-weight: 600;
    }
    .demo-replay {
      background: rgba(212, 175, 55, 0.18);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .demo-replay:hover {
      background: var(--gold);
      color: #120e09;
      border-color: var(--gold);
    }
    .demo-site-link {
      color: var(--gold);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 0.9rem;
      margin-left: 0.2rem;
    }

    @media (max-width: 768px) {
      .hero-top-meta, .hero-bottom-meta { padding: 1.2rem 1.4rem; }
      .demo-bar {
        bottom: 0.8rem;
        padding: 0.3rem 0.4rem;
        gap: 0.2rem;
      }
      .demo-label { display: none; }
      .demo-pill {
        font-size: 0.68rem;
        padding: 0.45rem 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       HERO BACKGROUND VIDEO STAGE
       ========================================================================== -->
  <div class="hero-stage" id="heroStage">
    <!-- Cinematic Letterbox Bars -->
    <div class="letterbox-bar letterbox-top"></div>
    <div class="letterbox-bar letterbox-bottom"></div>

    <video id="heroVideo" class="hero-video" autoplay loop muted playsinline poster="/zastavka_poster.jpg" preload="auto">
      <source src="/zastavka.webm" type="video/webm">
      <source src="/zastavka.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div id="ambientSpotlight" class="ambient-spotlight"></div>

    <!-- Top Meta Info -->
    <div class="hero-top-meta">
      <div class="meta-coords">38°34'35.9"N 68°48'15.2"E</div>
      <div class="meta-city">DUSHANBE · TAJIKISTAN</div>
    </div>

    <!-- Center Monumental Card with 3D Tilt -->
    <div class="hero-center" id="heroCenter">
      <div class="hero-emblem-wrap">
        <img src="/anzur_logo_gold.svg" alt="ANZUR RESTAURANT" />
      </div>
      <h1 class="monumental-title">ANZUR</h1>
      <p class="monumental-sub">НАЦИОНАЛЬНАЯ · ЕВРОПЕЙСКАЯ · ПАНАЗИАТСКАЯ КУХНЯ</p>
      <div class="hero-actions">
        <a href="/booking" class="btn-gold">Забронировать стол</a>
      </div>
    </div>

    <!-- Bottom Meta Info -->
    <div class="hero-bottom-meta">
      <div class="meta-hours">ПН — ВС · 10:00 — 00:00</div>
      <div class="meta-phone">+992 917 917 917</div>
    </div>
  </div>

  <!-- ==========================================================================
       DEMO BAR
       ========================================================================== -->
  <nav class="demo-bar">
    <span class="demo-label">Концепты:</span>
    <a href="/variant1.html" class="demo-pill">1. Портал сквозь буквы</a>
    <a href="/variant2.html" class="demo-pill">2. Световой морфинг</a>
    <a href="/variant3.html" class="demo-pill">3. Раздвижные створки</a>
    <a href="/variant4.html" class="demo-pill active">4. Ambient Spotlight</a>
    <button type="button" class="demo-pill demo-replay" onclick="replayVariant()">↺ Повторить</button>
    <a href="/" class="demo-pill demo-site-link">Сайт ↗</a>
  </nav>

  <script>
    function runAmbientSequence() {
      const stage = document.getElementById('heroStage');
      const video = document.getElementById('heroVideo');

      stage.classList.remove('is-loaded', 'is-unboxed');

      if (video.paused) {
        video.play().catch(() => {});
      }

      // Step 1: Video expands softly (0.1s)
      setTimeout(() => {
        stage.classList.add('is-loaded');
      }, 100);

      // Step 2: Letterbox opens, typography breathes in (0.7s)
      setTimeout(() => {
        stage.classList.add('is-unboxed');
      }, 700);
    }

    function replayVariant() {
      runAmbientSequence();
    }

    // 3D Tilt and Mouse Spotlight Interaction
    const stage = document.getElementById('heroStage');
    const center = document.getElementById('heroCenter');

    window.addEventListener('mousemove', (e) => {
      const xPercent = (e.clientX / window.innerWidth) * 100;
      const yPercent = (e.clientY / window.innerHeight) * 100;

      stage.style.setProperty('--mouse-x', `${xPercent}%`);
      stage.style.setProperty('--mouse-y', `${yPercent}%`);

      // Gentle 3D perspective tilt
      const xOffset = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
      const yOffset = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

      const rotateY = xOffset * 9;
      const rotateX = -yOffset * 9;

      if (center) {
        center.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }
    });

    // Touch support for mobile spotlight
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        const touch = e.touches[0];
        const xPercent = (touch.clientX / window.innerWidth) * 100;
        const yPercent = (touch.clientY / window.innerHeight) * 100;
        stage.style.setProperty('--mouse-x', `${xPercent}%`);
        stage.style.setProperty('--mouse-y', `${yPercent}%`);
      }
    }, { passive: true });

    window.addEventListener('DOMContentLoaded', runAmbientSequence);
  </script>
</body>
</html>
