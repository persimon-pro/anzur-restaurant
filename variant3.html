<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Вариант 3: Театральные створки (Вход в пространство) — Ресторан «Анзур»</title>
  <link rel="icon" href="/anzur_bulb_pure.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #060504;
      --gold: #D4AF37;
      --gold-light: #FCEFD8;
      --gold-dark: #916D2A;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #f7f4ed;
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hero-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      transform: scale(1.18);
      filter: brightness(0.65);
      transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), filter 2s ease;
    }
    .hero-video.is-active {
      transform: scale(1);
      filter: brightness(0.9);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(6, 5, 4, 0.45) 0%, rgba(6, 5, 4, 0.78) 65%, rgba(6, 5, 4, 0.95) 100%),
        linear-gradient(to bottom, rgba(6, 5, 4, 0.60) 0%, rgba(6, 5, 4, 0.25) 45%, rgba(6, 5, 4, 0.90) 100%);
      z-index: 2;
      opacity: 0;
      transition: opacity 1.4s ease;
      pointer-events: none;
    }
    .hero-overlay.is-active {
      opacity: 1;
    }

    /* ==========================================================================
       SPLIT ARCHITECTURAL GATES (LEFT & RIGHT)
       ========================================================================== */
    .gate-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.5%;
      z-index: 20;
      background: #070504;
      background-image: radial-gradient(circle at center, #0d0a08 0%, #050403 100%);
      transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
      pointer-events: none;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
    .gate-left {
      left: 0;
      border-right: 1px solid rgba(212, 175, 55, 0.35);
      transform-origin: left center;
    }
    .gate-right {
      right: 0;
      border-left: 1px solid rgba(212, 175, 55, 0.35);
      transform-origin: right center;
    }

    .gate-panel.open-left {
      transform: translateX(-102%);
    }
    .gate-panel.open-right {
      transform: translateX(102%);
    }

    /* Central Gate Emblem Lock */
    .gate-lock {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.8s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gate-lock.dissolve {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.4);
      pointer-events: none;
    }

    .gate-emblem-circle {
      width: 110px;
      height: 110px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(28, 22, 16, 0.95) 0%, rgba(10, 8, 6, 0.98) 100%);
      border: 1px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.3), inset 0 0 25px rgba(212, 175, 55, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .gate-emblem-circle img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 20px rgba(212, 175, 55, 0.15); }
      50% { box-shadow: 0 0 60px rgba(212, 175, 55, 0.55), inset 0 0 30px rgba(212, 175, 55, 0.35); }
    }

    .gate-prompt {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    .gate-lock:hover .gate-prompt {
      opacity: 1;
      color: var(--gold-light);
    }

    /* ==========================================================================
       HERO CONTENT (Revealed inside)
       ========================================================================== */
    .hero-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 1.5rem;
      max-width: 900px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, transform 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.6s;
      pointer-events: none;
    }
    .hero-content.is-revealed {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .hero-emblem-wrap {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.4rem;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.45));
    }
    .hero-emblem-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.85rem;
      line-height: 1.1;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold);
      font-weight: 400;
    }

    .hero-subtitle {
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      margin-bottom: 2.2rem;
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2.2rem;
      background: linear-gradient(135deg, #E6C875 0%, #C5983A 50%, #966F22 100%);
      color: #120e09;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 0 25px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 35px rgba(212, 175, 55, 0.45);
      filter: brightness(1.1);
    }

    /* ==========================================================================
       DEMO BAR
       ========================================================================== */
    .demo-bar {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(12, 9, 7, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 0.4rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15);
      max-width: 95vw;
      overflow-x: auto;
    }
    .demo-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      padding: 0 0.6rem 0 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .demo-pill {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      padding: 0.5rem 0.95rem;
      border-radius: 20px;
      background: transparent;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .demo-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .demo-pill.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(145, 109, 42, 0.3));
      border-color: rgba(212, 175, 55, 0.6);
      color: #FCEFD8;
      font-weight: 600;
    }
    .demo-replay {
      background: rgba(212, 175, 55, 0.18);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .demo-replay:hover {
      background: var(--gold);
      color: #120e09;
      border-color: var(--gold);
    }
    .demo-site-link {
      color: var(--gold);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 0.9rem;
      margin-left: 0.2rem;
    }

    @media (max-width: 768px) {
      .demo-bar {
        bottom: 0.8rem;
        padding: 0.3rem 0.4rem;
        gap: 0.2rem;
      }
      .demo-label { display: none; }
      .demo-pill {
        font-size: 0.68rem;
        padding: 0.45rem 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       HERO BACKGROUND VIDEO STAGE
       ========================================================================== -->
  <div class="hero-stage" id="heroStage">
    <video id="heroVideo" class="hero-video" autoplay loop muted playsinline poster="/zastavka_poster.jpg" preload="auto">
      <source src="/zastavka.webm" type="video/webm">
      <source src="/zastavka.mp4" type="video/mp4">
    </video>
    <div id="heroOverlay" class="hero-overlay"></div>

    <div id="heroContent" class="hero-content">
      <div class="hero-emblem-wrap">
        <img src="/anzur_logo_gold.svg" alt="ANZUR RESTAURANT" />
      </div>
      <h1 class="hero-title">ANZUR <em>RESTAURANT</em></h1>
      <p class="hero-subtitle">НАЦИОНАЛЬНАЯ · ЕВРОПЕЙСКАЯ · ПАНАЗИАТСКАЯ КУХНЯ</p>
      <div class="hero-actions">
        <a href="/booking" class="btn-gold">Забронировать стол</a>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       SPLIT ARCHITECTURAL GATES (LEFT & RIGHT WINGS)
       ========================================================================== -->
  <div id="gateLeft" class="gate-panel gate-left"></div>
  <div id="gateRight" class="gate-panel gate-right"></div>

  <!-- Central Emblem Gate Lock -->
  <div id="gateLock" class="gate-lock" onclick="openGates()">
    <div class="gate-emblem-circle">
      <img src="/anzur_logo_gold.svg" alt="ANZUR" />
    </div>
    <div class="gate-prompt">ВОЙТИ В ПРОСТРАНСТВО</div>
  </div>

  <!-- ==========================================================================
       DEMO BAR
       ========================================================================== -->
  <nav class="demo-bar">
    <span class="demo-label">Концепты:</span>
    <a href="/variant1.html" class="demo-pill">1. Портал сквозь буквы</a>
    <a href="/variant2.html" class="demo-pill">2. Световой морфинг</a>
    <a href="/variant3.html" class="demo-pill active">3. Раздвижные створки</a>
    <a href="/variant4.html" class="demo-pill">4. Ambient Spotlight</a>
    <button type="button" class="demo-pill demo-replay" onclick="replayVariant()">↺ Повторить</button>
    <a href="/" class="demo-pill demo-site-link">Сайт ↗</a>
  </nav>

  <script>
    let gatesOpened = false;

    function openGates() {
      if (gatesOpened) return;
      gatesOpened = true;

      const gateLeft = document.getElementById('gateLeft');
      const gateRight = document.getElementById('gateRight');
      const gateLock = document.getElementById('gateLock');
      const video = document.getElementById('heroVideo');
      const overlay = document.getElementById('heroOverlay');
      const content = document.getElementById('heroContent');

      // Dissolve lock
      gateLock.classList.add('dissolve');

      // Slide open the doors
      setTimeout(() => {
        gateLeft.classList.add('open-left');
        gateRight.classList.add('open-right');
        video.classList.add('is-active');
        overlay.classList.add('is-active');
        content.classList.add('is-revealed');
      }, 300);
    }

    function replayVariant() {
      gatesOpened = false;
      const gateLeft = document.getElementById('gateLeft');
      const gateRight = document.getElementById('gateRight');
      const gateLock = document.getElementById('gateLock');
      const video = document.getElementById('heroVideo');
      const overlay = document.getElementById('heroOverlay');
      const content = document.getElementById('heroContent');

      gateLeft.classList.remove('open-left');
      gateRight.classList.remove('open-right');
      gateLock.classList.remove('dissolve');
      video.classList.remove('is-active');
      overlay.classList.remove('is-active');
      content.classList.remove('is-revealed');

      // Auto-open again after brief preview
      setTimeout(openGates, 1400);
    }

    // Auto-open after 1.2s or allow user to click
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(openGates, 1200);
    });
  </script>
</body>
</html>
