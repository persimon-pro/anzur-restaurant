<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ресторан «Анзур» — Прожектор и 3D-наклон (Ambient Spotlight)</title>
  <link rel="icon" href="anzur_bulb_pure.png" type="image/png" />

  <!-- Fonts: Cormorant Garamond + Space Grotesk + Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- GSAP, ScrollTrigger, Three.js, Lenis, Motion -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>

  <style>
    :root {
      --bg:             #060504;
      --bg-card:        #0C0A09;
      --border:         #1A1714;
      --border-subtle:  #28231E;
      --gold:           #C5A059;
      --gold-light:     #E5C786;
      --text:           #F5F2EB;
      --text-muted:     #A59C90;
      --font-serif:     'Cormorant Garamond', Georgia, serif;
      --font-sans:      'Space Grotesk', -apple-system, sans-serif;
      --font-mono:      'Space Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold); }

    /* ==========================================================================
       1. ALCHEMIST INTRO SPLASH (Pure Concentric Bulb — No Text Clutter)
       ========================================================================== */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #040302;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1),
                  filter 1.3s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 1.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash.done {
      opacity: 0;
      filter: blur(50px) brightness(1.5);
      transform: scale(1.2);
      pointer-events: none;
      visibility: hidden;
    }
    .splash-box {
      width: min(400px, 72vmin);
      height: min(400px, 72vmin);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sp-ring-1 {
      stroke-dasharray: 820;
      stroke-dashoffset: 820;
      animation: drawRing 0.65s cubic-bezier(0.25, 1, 0.4, 1) 0.1s forwards;
    }
    .sp-ring-2 {
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      animation: drawRing 0.55s cubic-bezier(0.25, 1, 0.4, 1) 0.55s forwards;
    }
    .sp-ring-3 {
      opacity: 0;
      transform-origin: 200px 210px;
      animation: popCenter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }
    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }
    @keyframes popCenter {
      0% { opacity: 0; transform: scale(0.3); filter: drop-shadow(0 0 25px var(--gold)); }
      70% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 35px var(--gold)); }
      100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 12px var(--gold)); }
    }

    /* ==========================================================================
       GLOBAL THREE.JS GOLDEN ATMOSPHERE CANVAS
       ========================================================================== */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
    }

    /* ==========================================================================
       2. FIRST WELCOMING SCREEN (WITH MOVING AMBIENT SPOTLIGHT & 3D TILT)
       ========================================================================== */
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1200px;
      z-index: 5;
      border-bottom: 1px solid var(--border);
    }

    .hero-backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #060504;
      z-index: 0;
    }
    .hero-backdrop-video {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.06) brightness(0.86);
      will-change: transform;
    }
    .hero-backdrop-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(6, 5, 4, 0.48) 0%, rgba(6, 5, 4, 0.78) 65%, rgba(6, 5, 4, 0.95) 100%),
        linear-gradient(to bottom, rgba(6, 5, 4, 0.65) 0%, rgba(6, 5, 4, 0.35) 45%, rgba(6, 5, 4, 0.92) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Interactive 3D Ambient Spotlight following cursor */
    .ambient-spotlight {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        circle 520px at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(229, 199, 134, 0.24) 0%,
        rgba(197, 160, 89, 0.07) 48%,
        transparent 78%
      );
      mix-blend-mode: screen;
    }

    /* Center Hero Block — Only Logo, Subtitle, and Button */
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 1.5rem;
      max-width: 900px;
      margin: auto;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .hero-logo-wrap {
      margin: 0 auto 1.8rem;
      max-width: 290px;
      width: 58%;
      transform: translateZ(65px);
    }
    .hero-logo-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 6px 28px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 42px rgba(197, 160, 89, 0.32));
    }

    .hero-subtitle {
      font-family: var(--font-mono);
      font-size: clamp(0.72rem, 1.15vw, 0.86rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2.8rem;
      line-height: 1.9;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      transform: translateZ(45px);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      transform: translateZ(85px);
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.05rem 2.8rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: #060504;
      text-decoration: none;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-gold:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
      box-shadow: 0 12px 34px rgba(197, 160, 89, 0.28);
    }

    @media (max-width: 768px) {
      .hero-logo-wrap { max-width: 230px; width: 65%; }
      .hero-subtitle {
        letter-spacing: 0.18em;
        line-height: 1.65;
        font-size: 0.7rem;
        margin-bottom: 2.2rem;
      }
    }

    /* ==========================================================================
       3. EXPANDING CINEMA PORTAL (GSAP SCROLLTRIGGER PIN)
       ========================================================================== */
    .portal-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      background: var(--bg);
    }

    .portal-frame {
      position: relative;
      width: 46vw;
      height: 60vh;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(197, 160, 89, 0.4);
      box-shadow: 0 35px 100px rgba(0, 0, 0, 0.9);
      z-index: 6;
    }
    .portal-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.06) brightness(0.84);
    }
    .portal-frame-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6,5,4,0.15) 0%, rgba(6,5,4,0.72) 100%);
    }

    .portal-title-overlay {
      position: absolute;
      z-index: 10;
      text-align: center;
      pointer-events: none;
      padding: 0 2rem;
    }
    .portal-title-overlay h2 {
      font-family: var(--font-serif);
      font-size: clamp(2.6rem, 5.5vw, 5.2rem);
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 12px 45px rgba(0, 0, 0, 0.95);
    }
    .portal-title-overlay h2 em {
      font-style: italic;
      color: var(--gold-light);
    }

    /* ==========================================================================
       4. HORIZONTAL PARALLAX GALLERY (ALL 5 SPACES FROM «ДЛЯ САЙТА»)
       ========================================================================== */
    .horizontal-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top: 1px solid var(--border);
    }

    .horiz-header {
      position: absolute;
      top: 3.5rem;
      left: 4vw;
      right: 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .horiz-title {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4vw, 3.6rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
    }
    .horiz-title em {
      font-style: italic;
      color: var(--gold);
    }

    .horiz-track {
      display: flex;
      align-items: center;
      gap: 3.5vw;
      padding: 4.5rem 6vw 0;
      width: max-content;
      will-change: transform;
    }

    .space-card {
      position: relative;
      width: clamp(340px, 56vw, 820px);
      height: clamp(400px, 66vh, 620px);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }
    .space-card-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .space-card-img {
      width: 120%;
      height: 110%;
      object-fit: cover;
      transform: translateX(-8%) scale(1.03);
      filter: brightness(0.84) contrast(1.06);
      transition: filter 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .space-card:hover .space-card-img {
      filter: brightness(0.96) contrast(1.1);
    }
    .space-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 35%, rgba(6, 5, 4, 0.9) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.6rem;
    }
    .space-card-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .space-card-bottom h3 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3.2vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }
    .space-thumbs {
      display: flex;
      gap: 0.6rem;
    }
    .space-thumb {
      width: 64px;
      height: 44px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      overflow: hidden;
      opacity: 0.6;
      transition: all 0.25s ease;
    }
    .space-thumb.is-active,
    .space-thumb:hover {
      opacity: 1;
      border-color: var(--gold-light);
      transform: translateY(-2px);
    }
    .space-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==========================================================================
       5. FINALE CALL TO ACTION
       ========================================================================== */
    .finale-section {
      position: relative;
      z-index: 5;
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem;
      border-top: 1px solid var(--border);
      background: radial-gradient(circle at 50% 50%, rgba(197, 160, 89, 0.1), transparent 70%);
    }
    .finale-logo {
      width: 220px;
      margin-bottom: 2.2rem;
      filter: drop-shadow(0 0 35px rgba(197, 160, 89, 0.3));
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(4, 3, 2, 0.95);
      backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      cursor: pointer;
    }
    .lightbox-modal.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .lightbox-img-wrap {
      max-width: 1180px;
      width: 92vw;
      height: 78vh;
      border: 1px solid var(--gold);
      overflow: hidden;
      box-shadow: 0 30px 100px rgba(0,0,0,0.95);
    }
    .lightbox-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 1. ALCHEMIST CONCENTRIC BULB SPLASH -->
  <div id="splash" onclick="dismissSplash()">
    <div class="splash-box">
      <svg class="splash-svg" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">

          <path class="sp-ring-2"
                d="M 216.5 136.2 L 221.8 138.2 L 228.0 143.6 L 243.3 164.3 L 256.2 186.6 L 263.2 208.4 L 263.9 219.0 L 262.6 229.9 L 259.1 240.7 L 252.0 252.9 L 245.0 260.9 L 234.5 269.2 L 223.7 275.1 L 210.4 279.1 L 200.6 280.3 L 186.7 279.2 L 172.0 274.9 L 161.0 269.0 L 149.4 259.3 L 141.6 249.9 L 136.3 240.6 L 131.6 227.0 L 129.9 210.5 L 131.1 199.4 L 138.4 181.8 L 146.9 171.2 L 168.5 155.9 L 187.1 146.2 L 208.4 137.0 Z"
                stroke="url(#splashGold)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path class="sp-ring-3"
                d="M 201.80 186.82 L 194.61 192.81 L 181.43 201.20 L 176.63 208.39 L 176.63 217.98 L 182.62 227.56 L 194.61 233.55 L 204.19 233.55 L 205.39 232.36 L 207.79 232.36 L 212.58 229.96 L 218.57 221.57 L 218.57 209.59 L 216.18 205.99 L 216.18 203.60 L 213.78 201.20 L 210.19 194.01 Z"
                fill="url(#splashGold)" stroke="url(#splashGold)" stroke-width="6" stroke-linejoin="round" />
        </g>
      </svg>
    </div>
  </div>

  <!-- Three.js WebGL Golden Atmosphere Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- 2. FIRST WELCOMING SCREEN (MOVING AMBIENT SPOTLIGHT + 3D TILT) -->
  <header class="hero" id="heroSection">
    <div class="hero-backdrop">
      <video class="hero-backdrop-video" id="heroVideo" autoplay loop muted playsinline preload="auto" poster="taimlars_poster.jpg">
        <source src="taimlars.webm" type="video/webm" />
        <source src="taimlars.mp4" type="video/mp4" />
      </video>
      <div class="hero-backdrop-overlay"></div>
    </div>

    <div class="ambient-spotlight" id="ambientSpotlight"></div>

    <div class="hero-content" id="heroContent3D">
      <div class="hero-logo-wrap" id="heroLogo">
        <img src="anzur_logo_gold.png" alt="ANZUR RESTAURANT" class="hero-logo-img" />
      </div>

      <p class="hero-subtitle" id="heroSubtitle">
        <span>НАЦИОНАЛЬНАЯ · ЕВРОПЕЙСКАЯ · ПАНАЗИАТСКАЯ</span>
        <span>КУХНЯ</span>
      </p>

      <div class="hero-actions" id="heroActionBtn">
        <a href="booking.html" class="btn-gold magnetic-btn">
          ЗАБРОНИРОВАТЬ СТОЛ
        </a>
      </div>
    </div>
  </header>

  <!-- 3. EXPANDING TIMELAPSE PORTAL -->
  <section class="portal-section" id="portalSection">
    <div class="portal-frame" id="portalFrame">
      <video autoplay muted loop playsinline preload="metadata" poster="tailaps_poster.jpg">
        <source src="tailaps.webm" type="video/webm" />
        <source src="tailaps.mp4" type="video/mp4" />
      </video>
      <div class="portal-frame-overlay"></div>
    </div>

    <div class="portal-title-overlay" id="portalTitle">
      <h2>Вечерний <em>Анзур</em></h2>
    </div>
  </section>

  <!-- 4. HORIZONTAL PARALLAX GALLERY -->
  <section class="horizontal-section" id="spacesSection">
    <div class="horiz-header">
      <h2 class="horiz-title">Атмосфера <em>залов</em></h2>
    </div>

    <div class="horiz-track" id="horizTrack">
      <article class="space-card">
        <div class="space-card-media">
          <img class="space-card-img" src="location_photos/main_hall_01.jpg" alt="Главный Зал" />
        </div>
        <div class="space-card-overlay">
          <div class="space-card-bottom">
            <h3>Главный Зал</h3>
            <div class="space-thumbs">
              <div class="space-thumb is-active" data-src="location_photos/main_hall_01.jpg"><img src="location_photos/main_hall_01.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/main_hall_02.jpg"><img src="location_photos/main_hall_02.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/main_hall_03.jpg"><img src="location_photos/main_hall_03.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/main_hall_04.jpg"><img src="location_photos/main_hall_04.jpg" alt="" /></div>
            </div>
          </div>
        </div>
      </article>

      <article class="space-card">
        <div class="space-card-media">
          <img class="space-card-img" src="location_photos/terrace_01.jpg" alt="Летняя Терраса" />
        </div>
        <div class="space-card-overlay">
          <div class="space-card-bottom">
            <h3>Летняя Терраса</h3>
            <div class="space-thumbs">
              <div class="space-thumb is-active" data-src="location_photos/terrace_01.jpg"><img src="location_photos/terrace_01.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/terrace_02.jpg"><img src="location_photos/terrace_02.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/terrace_03.jpg"><img src="location_photos/terrace_03.jpg" alt="" /></div>
            </div>
          </div>
        </div>
      </article>

      <article class="space-card">
        <div class="space-card-media">
          <img class="space-card-img" src="location_photos/veranda_01.jpg" alt="Тихая Веранда" />
        </div>
        <div class="space-card-overlay">
          <div class="space-card-bottom">
            <h3>Тихая Веранда</h3>
            <div class="space-thumbs">
              <div class="space-thumb is-active" data-src="location_photos/veranda_01.jpg"><img src="location_photos/veranda_01.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/veranda_02.jpg"><img src="location_photos/veranda_02.jpg" alt="" /></div>
            </div>
          </div>
        </div>
      </article>

      <article class="space-card">
        <div class="space-card-media">
          <img class="space-card-img" src="location_photos/karaoke_01.jpg" alt="Караоке и VIP" />
        </div>
        <div class="space-card-overlay">
          <div class="space-card-bottom">
            <h3>Караоке &amp; VIP</h3>
            <div class="space-thumbs">
              <div class="space-thumb is-active" data-src="location_photos/karaoke_01.jpg"><img src="location_photos/karaoke_01.jpg" alt="" /></div>
              <div class="space-thumb" data-src="location_photos/karaoke_02.jpg"><img src="location_photos/karaoke_02.jpg" alt="" /></div>
            </div>
          </div>
        </div>
      </article>

      <article class="space-card">
        <div class="space-card-media">
          <img class="space-card-img" src="events_star_concert_yulduz.jpg" alt="Концерты Звёзд" />
        </div>
        <div class="space-card-overlay">
          <div class="space-card-bottom">
            <h3>Концерты Звёзд</h3>
            <div class="space-thumbs">
              <div class="space-thumb is-active" data-src="events_star_concert_yulduz.jpg"><img src="events_star_concert_yulduz.jpg" alt="" /></div>
              <div class="space-thumb" data-src="events_star_concert_closeup.jpg"><img src="events_star_concert_closeup.jpg" alt="" /></div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </section>

  <!-- 5. FINALE SECTION -->
  <section class="finale-section">
    <img src="anzur_logo_gold.png" alt="ANZUR RESTAURANT" class="finale-logo" />
    <p class="hero-subtitle">
      <span>НАЦИОНАЛЬНАЯ · ЕВРОПЕЙСКАЯ · ПАНАЗИАТСКАЯ</span>
      <span>КУХНЯ</span>
    </p>
    <a href="booking.html" class="btn-gold magnetic-btn">ЗАБРОНИРОВАТЬ СТОЛ</a>
  </section>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <div class="lightbox-img-wrap">
      <img id="lightboxImg" src="location_photos/main_hall_01.jpg" alt="" />
    </div>
  </div>

  <script>
    let splashDismissed = false;
    function dismissSplash() {
      if (splashDismissed) return;
      splashDismissed = true;
      const splash = document.getElementById('splash');
      if (splash) splash.classList.add('done');

      if (window.gsap) {
        gsap.fromTo(
          '#heroLogo',
          { opacity: 0, y: 28, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 1.3, ease: 'power3.out', delay: 0.15 }
        );
        gsap.fromTo(
          '#heroSubtitle',
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 1.1, ease: 'power3.out', delay: 0.35 }
        );
        gsap.fromTo(
          '#heroActionBtn',
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 1.1, ease: 'power3.out', delay: 0.52 }
        );
      }
    }

    setTimeout(dismissSplash, 1450);

    (function () {
      'use strict';

      let lenis = null;
      let scrollVelocity = 0;

      if (window.Lenis) {
        lenis = new Lenis({
          duration: 1.25,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true
        });

        lenis.on('scroll', (e) => {
          scrollVelocity = e.velocity || 0;
          if (window.ScrollTrigger) ScrollTrigger.update();
        });

        if (window.gsap && window.ScrollTrigger) {
          gsap.registerPlugin(ScrollTrigger);
          gsap.ticker.add((time) => lenis.raf(time * 1000));
          gsap.ticker.lagSmoothing(0);
        }
      }

      const canvas = document.getElementById('webgl-canvas');
      let mouseNormX = 0;
      let mouseNormY = 0;

      if (window.THREE && canvas) {
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 12;

        const count = 240;
        const positions = new Float32Array(count * 3);
        const scales = new Float32Array(count);
        const speeds = new Float32Array(count);
        const phases = new Float32Array(count);

        for (let i = 0; i < count; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 26;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 16;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 12;
          scales[i] = Math.random() * 20 + 5;
          speeds[i] = Math.random() * 0.01 + 0.003;
          phases[i] = Math.random() * Math.PI * 2;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
        geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

        const material = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          uniforms: {
            uTime: { value: 0 },
            uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
          },
          vertexShader: `
            attribute float aScale;
            attribute float aPhase;
            uniform float uTime;
            uniform float uPixelRatio;
            varying float vAlpha;
            void main() {
              vec3 pos = position;
              pos.x += sin(uTime * 0.6 + aPhase) * 0.3;
              vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
              gl_Position = projectionMatrix * mvPosition;
              gl_PointSize = aScale * uPixelRatio * (8.0 / -mvPosition.z);
              vAlpha = 0.26 + 0.28 * sin(uTime * 1.5 + aPhase);
            }
          `,
          fragmentShader: `
            varying float vAlpha;
            void main() {
              float d = length(gl_PointCoord - vec2(0.5));
              if (d > 0.5) discard;
              float glow = smoothstep(0.5, 0.02, d);
              vec3 gold = mix(vec3(0.77, 0.62, 0.35), vec3(0.96, 0.86, 0.60), glow);
              gl_FragColor = vec4(gold, glow * vAlpha);
            }
          `
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        const clock = new THREE.Clock();
        function renderLoop() {
          const t = clock.getElapsedTime();
          material.uniforms.uTime.value = t;

          const posArr = geometry.attributes.position.array;
          const boost = Math.min(Math.abs(scrollVelocity) * 0.012, 0.28);
          for (let i = 0; i < count; i++) {
            posArr[i * 3 + 1] += speeds[i] + boost;
            if (posArr[i * 3 + 1] > 8) posArr[i * 3 + 1] = -8;
          }
          geometry.attributes.position.needsUpdate = true;

          camera.position.x += (mouseNormX * 1.1 - camera.position.x) * 0.04;
          camera.position.y += (-mouseNormY * 0.8 - camera.position.y) * 0.04;
          camera.lookAt(0, 0, 0);

          renderer.render(scene, camera);
          requestAnimationFrame(renderLoop);
        }
        renderLoop();

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      const heroContent3D = document.getElementById('heroContent3D');
      const spotlight = document.getElementById('ambientSpotlight');
      const heroVideo = document.getElementById('heroVideo');

      window.addEventListener('pointermove', (e) => {
        mouseNormX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseNormY = (e.clientY / window.innerHeight - 0.5) * 2;

        if (spotlight) {
          spotlight.style.setProperty('--mouse-x', `${(e.clientX / window.innerWidth) * 100}%`);
          spotlight.style.setProperty('--mouse-y', `${(e.clientY / window.innerHeight) * 100}%`);
        }

        if (heroContent3D && window.gsap) {
          gsap.to(heroContent3D, {
            rotationY: mouseNormX * 9,
            rotationX: -mouseNormY * 9,
            duration: 0.65,
            ease: 'power2.out'
          });
        }

        if (heroVideo && window.gsap) {
          gsap.to(heroVideo, {
            x: -mouseNormX * 16,
            y: -mouseNormY * 12,
            duration: 1.1,
            ease: 'power2.out'
          });
        }
      });

      const motionAnimate = window.Motion && window.Motion.animate ? window.Motion.animate : null;
      document.querySelectorAll('.magnetic-btn').forEach((btn) => {
        btn.addEventListener('pointermove', (e) => {
          const r = btn.getBoundingClientRect();
          const dx = e.clientX - (r.left + r.width / 2);
          const dy = e.clientY - (r.top + r.height / 2);
          if (motionAnimate) {
            motionAnimate(
              btn,
              { transform: `translate(${dx * 0.22}px, ${dy * 0.28}px) scale(1.03)` },
              { duration: 0.25 }
            );
          }
        });
        btn.addEventListener('pointerleave', () => {
          if (motionAnimate) {
            motionAnimate(
              btn,
              { transform: 'translate(0px, 0px) scale(1)' },
              { duration: 0.45, easing: [0.16, 1, 0.3, 1] }
            );
          }
        });
      });

      if (window.gsap && window.ScrollTrigger) {
        gsap.timeline({
          scrollTrigger: {
            trigger: '#portalSection',
            start: 'top top',
            end: '+=130%',
            scrub: 1,
            pin: true
          }
        })
          .to('#portalFrame', {
            width: '100vw',
            height: '100vh',
            borderRadius: '0px',
            borderWidth: '0px',
            ease: 'power2.inOut'
          }, 0)
          .fromTo(
            '#portalTitle',
            { scale: 0.88, opacity: 0.65 },
            { scale: 1.08, opacity: 1, ease: 'power2.out' },
            0
          );

        const horizTrack = document.getElementById('horizTrack');
        if (horizTrack) {
          gsap.to(horizTrack, {
            x: () => -(horizTrack.scrollWidth - window.innerWidth + 80),
            ease: 'none',
            scrollTrigger: {
              trigger: '#spacesSection',
              start: 'top top',
              end: () => `+=${horizTrack.scrollWidth - window.innerWidth}`,
              pin: true,
              scrub: 1,
              invalidateOnRefresh: true
            }
          });

          document.querySelectorAll('.space-card-img').forEach((img) => {
            gsap.to(img, {
              xPercent: 8,
              ease: 'none',
              scrollTrigger: {
                trigger: '#spacesSection',
                start: 'top top',
                end: () => `+=${horizTrack.scrollWidth - window.innerWidth}`,
                scrub: true
              }
            });
          });
        }
      }

      document.querySelectorAll('.space-card').forEach((card) => {
        const mainImg = card.querySelector('.space-card-img');
        const thumbs = card.querySelectorAll('.space-thumb');

        thumbs.forEach((thumb) => {
          thumb.addEventListener('click', (e) => {
            e.stopPropagation();
            const src = thumb.getAttribute('data-src');
            thumbs.forEach((t) => t.classList.remove('is-active'));
            thumb.classList.add('is-active');
            if (mainImg && src) {
              if (motionAnimate) {
                motionAnimate(mainImg, { opacity: [0.35, 1] }, { duration: 0.4 });
              }
              mainImg.src = src;
            }
          });
        });

        card.addEventListener('click', () => {
          const modal = document.getElementById('lightboxModal');
          const modalImg = document.getElementById('lightboxImg');
          if (modal && modalImg && mainImg) {
            modalImg.src = mainImg.src;
            modal.classList.add('is-open');
          }
        });
      });

      const modal = document.getElementById('lightboxModal');
      if (modal) {
        modal.addEventListener('click', () => modal.classList.remove('is-open'));
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') modal.classList.remove('is-open');
        });
      }
    })();
  </script>
</body>
</html>
