<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Вариант 1: Кинематографичный портал сквозь буквы — Ресторан «Анзур»</title>
  <link rel="icon" href="/anzur_bulb_pure.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #060504;
      --gold: #D4AF37;
      --gold-light: #FCEFD8;
      --gold-dark: #916D2A;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #f7f4ed;
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       HERO & BACKGROUND VIDEO
       ========================================================================== */
    .hero-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1.4s cubic-bezier(0.2, 0.8, 0.2, 1), transform 2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .hero-video.is-active {
      opacity: 1;
      transform: scale(1);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(6, 5, 4, 0.50) 0%, rgba(6, 5, 4, 0.80) 70%, rgba(6, 5, 4, 0.95) 100%),
        linear-gradient(to bottom, rgba(6, 5, 4, 0.65) 0%, rgba(6, 5, 4, 0.35) 45%, rgba(6, 5, 4, 0.90) 100%);
      z-index: 2;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .hero-overlay.is-active {
      opacity: 1;
    }

    /* ==========================================================================
       HERO CONTENT (Appears after portal zoom)
       ========================================================================== */
    .hero-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 1.5rem;
      max-width: 900px;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .hero-content.is-revealed {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .hero-emblem-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.4rem;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.45));
    }
    .hero-emblem-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.8rem;
      line-height: 1.1;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold);
      font-weight: 400;
    }

    .hero-subtitle {
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      margin-bottom: 2.2rem;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2.2rem;
      background: linear-gradient(135deg, #E6C875 0%, #C5983A 50%, #966F22 100%);
      color: #120e09;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 0 25px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 35px rgba(212, 175, 55, 0.45);
      filter: brightness(1.1);
    }

    /* ==========================================================================
       THE PORTAL MASK OVERLAY
       ========================================================================== */
    .portal-curtain {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #040302;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.8s ease 0.6s;
    }
    .portal-curtain.done {
      opacity: 0;
      visibility: hidden;
    }

    .portal-svg-stage {
      width: 100vw;
      height: 100vh;
      overflow: visible;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
      transition: transform 1.5s cubic-bezier(0.75, 0, 0.2, 1), opacity 0.6s ease 0.9s;
    }
    .portal-curtain.is-zooming .portal-svg-stage {
      transform: scale(26);
      opacity: 0;
    }

    /* Golden border shine on portal cutout */
    .portal-text-outline {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(75px, 15vw, 160px);
      letter-spacing: 0.22em;
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 1.2;
      filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.7));
    }

    /* ==========================================================================
       FLOATING DEMO SWITCHER TOOLBAR
       ========================================================================== */
    .demo-bar {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(12, 9, 7, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 0.4rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15);
      max-width: 95vw;
      overflow-x: auto;
    }
    .demo-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      padding: 0 0.6rem 0 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .demo-pill {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      padding: 0.5rem 0.95rem;
      border-radius: 20px;
      background: transparent;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .demo-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .demo-pill.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(145, 109, 42, 0.3));
      border-color: rgba(212, 175, 55, 0.6);
      color: #FCEFD8;
      font-weight: 600;
    }
    .demo-replay {
      background: rgba(212, 175, 55, 0.18);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .demo-replay:hover {
      background: var(--gold);
      color: #120e09;
      border-color: var(--gold);
    }
    .demo-site-link {
      color: var(--gold);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 0.9rem;
      margin-left: 0.2rem;
    }

    @media (max-width: 768px) {
      .demo-bar {
        bottom: 0.8rem;
        padding: 0.3rem 0.4rem;
        gap: 0.2rem;
      }
      .demo-label { display: none; }
      .demo-pill {
        font-size: 0.68rem;
        padding: 0.45rem 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       HERO BACKGROUND VIDEO STAGE
       ========================================================================== -->
  <div class="hero-stage" id="heroStage">
    <video id="heroVideo" class="hero-video" autoplay loop muted playsinline poster="/zastavka_poster.jpg" preload="auto">
      <source src="/zastavka.webm" type="video/webm">
      <source src="/zastavka.mp4" type="video/mp4">
    </video>
    <div id="heroOverlay" class="hero-overlay"></div>

    <div id="heroContent" class="hero-content">
      <div class="hero-emblem-wrap">
        <img src="/anzur_logo_gold.svg" alt="ANZUR RESTAURANT" />
      </div>
      <h1 class="hero-title">ANZUR <em>RESTAURANT</em></h1>
      <p class="hero-subtitle">НАЦИОНАЛЬНАЯ · ЕВРОПЕЙСКАЯ · ПАНАЗИАТСКАЯ КУХНЯ</p>
      <div class="hero-actions">
        <a href="/booking" class="btn-gold">Забронировать стол</a>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       PORTAL CUTOUT (SVG MASK REVEAL)
       ========================================================================== -->
  <div id="portalCurtain" class="portal-curtain">
    <svg class="portal-svg-stage" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FCEFD8" />
          <stop offset="40%" stop-color="#DEBE7A" />
          <stop offset="80%" stop-color="#C5A059" />
          <stop offset="100%" stop-color="#916D2A" />
        </linearGradient>

        <!-- Mask: Black hides, White shows -->
        <mask id="portalTextMask">
          <!-- Opaque white cover -->
          <rect width="100%" height="100%" fill="white" />
          <!-- The cutout letters (Black punches hole to reveal video!) -->
          <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
                font-family="'Cormorant Garamond', Georgia, serif"
                font-size="160" font-weight="300" letter-spacing="0.24em" fill="black">
            ANZUR
          </text>
        </mask>
      </defs>

      <!-- Black solid curtain with punch-hole text mask -->
      <rect width="100%" height="100%" fill="#050403" mask="url(#portalTextMask)" />

      <!-- Glowing gold outline around the punched letters -->
      <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" class="portal-text-outline">
        ANZUR
      </text>
    </svg>
  </div>

  <!-- ==========================================================================
       FLOATING DEMO SWITCHER
       ========================================================================== -->
  <nav class="demo-bar">
    <span class="demo-label">Концепты:</span>
    <a href="/variant1.html" class="demo-pill active">1. Портал сквозь буквы</a>
    <a href="/variant2.html" class="demo-pill">2. Световой морфинг</a>
    <a href="/variant3.html" class="demo-pill">3. Раздвижные створки</a>
    <a href="/variant4.html" class="demo-pill">4. Ambient Spotlight</a>
    <button type="button" class="demo-pill demo-replay" onclick="replayVariant()">↺ Повторить</button>
    <a href="/" class="demo-pill demo-site-link">Сайт ↗</a>
  </nav>

  <script>
    function runPortalSequence() {
      const curtain = document.getElementById('portalCurtain');
      const video = document.getElementById('heroVideo');
      const overlay = document.getElementById('heroOverlay');
      const content = document.getElementById('heroContent');

      // Reset state
      curtain.classList.remove('done', 'is-zooming');
      video.classList.remove('is-active');
      overlay.classList.remove('is-active');
      content.classList.remove('is-revealed');

      // Video starts playing behind immediately
      if (video.paused) {
        video.play().catch(() => {});
      }

      // Step 1: Let the user observe the live timelapse playing INSIDE the letters (1.3s)
      setTimeout(() => {
        // Step 2: Cinematic fly-through zoom
        curtain.classList.add('is-zooming');
        video.classList.add('is-active');
      }, 1300);

      // Step 3: Remove curtain, fade in hero overlay and content
      setTimeout(() => {
        curtain.classList.add('done');
        overlay.classList.add('is-active');
        content.classList.add('is-revealed');
      }, 2300);
    }

    function replayVariant() {
      runPortalSequence();
    }

    // Auto-start on load
    window.addEventListener('DOMContentLoaded', runPortalSequence);
  </script>
</body>
</html>
